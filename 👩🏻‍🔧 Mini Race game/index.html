<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Racing Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="game">
        <div id="score">Score: 0</div>

        <div id="road">
            <div id="player"></div>
        </div>

        <div id="menu">
            <h2>Kies Moeilijkheidsgraad🚦</h2>
            <div class="traffic-light">
                <button class="light red" onclick="startGame('hardcore')">
                    <span>Hardcore</span>
                </button>
                <button class="light orange" onclick="startGame('medium')">
                    <span>Medium</span>
                </button>
                <button class="light green" onclick="startGame('easy')">
                    <span>Easy</span>
                </button>
            </div>
        </div>

        <div id="gameOver">
            <h1>Game Over</h1>
            <p id="finalScore">Score: 0</p>
            <button id="restartBtn" onclick="showMenu()">Menu</button>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
